    name: Build Android APK

    on:
      workflow_dispatch: # Cho phép bấm nút chạy thủ công

    jobs:
      build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20

          - name: Setup PNPM
            uses: pnpm/action-setup@v3
            with:
              version: 8

          - name: Setup Java JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu'
              java-version: '17'

          - name: Setup Android SDK
            uses: android-actions/setup-android@v3

          - name: Install Dependencies
            run: pnpm install

          - name: Add Capacitor Mode
            run: |
              pnpm add -D @capacitor/cli @capacitor/core
              npx quasar mode add capacitor
            env:
              CI: false

          - name: Add Android Platform
            run: |
              cd src-capacitor
              pnpm add @capacitor/android
              npx cap add android

          - name: Build Quasar & Capacitor
            run: npx quasar build -m capacitor -T android

          - name: Compile APK with Gradle
            run: |
              cd src-capacitor/android
              chmod +x gradlew
              ./gradlew assembleDebug

          - name: Upload APK Artifact
            uses: actions/upload-artifact@v4
            with:
              name: KongyingMap-debug-apk
              path: src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
