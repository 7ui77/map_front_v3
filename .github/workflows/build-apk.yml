    name: Build Android APK

    on:
      workflow_dispatch:

    jobs:
      build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup Java JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu'
              java-version: '17'

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20

          - name: Setup PNPM
            uses: pnpm/action-setup@v3
            with:
              version: 8

          - name: Install Project Dependencies
            run: pnpm install --no-frozen-lockfile

          - name: Setup Capacitor and Android Platform
            run: |
              npx quasar mode add capacitor --app-id site.yuanshen.map --app-name "Kongying Map"
              cd src-capacitor
              npm install --legacy-peer-deps
              npm install @capacitor/android --legacy-peer-deps
              npx cap add android
              cd ..

          - name: Build Web & Capacitor Assets
            run: npx quasar build -m capacitor -T android
            env:
              NODE_OPTIONS: "--max-old-space-size=4096"

          - name: Compile APK with Gradle
            run: |
              cd src-capacitor/android
              chmod +x gradlew
              ./gradlew assembleDebug

          - name: Upload APK Artifact
            uses: actions/upload-artifact@v4
            with:
              name: KongyingMap-debug-apk
              path: src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
