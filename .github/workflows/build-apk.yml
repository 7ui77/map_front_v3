    name: Build Android APK

    on:
      workflow_dispatch:

    jobs:
      build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup Java JDK 17
            uses: actions/setup-java@v4
            with:
              distribution: 'zulu'
              java-version: '17'

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20

          - name: Setup PNPM
            uses: pnpm/action-setup@v3
            with:
              version: 8

          - name: Install Project Dependencies
            run: pnpm install --no-frozen-lockfile

          - name: Build Web Application
            run: pnpm build
            env:
              NODE_OPTIONS: "--max-old-space-size=4096"
              VITE_API_BASE: "https://yuanshen.site"

          - name: Setup Capacitor and Android Platform
            run: |
              pnpm add -D @capacitor/core @capacitor/cli @capacitor/android
              npx cap init "Kongying Map" "site.yuanshen.map" --web-dir "dist/spa"
              npx cap add android
              npx cap sync android

          - name: Compile APK with Gradle
            run: |
              cd android
              chmod +x gradlew
              ./gradlew assembleDebug

          - name: Upload APK Artifact
            uses: actions/upload-artifact@v4
            with:
              name: KongyingMap-debug-apk
              path: android/app/build/outputs/apk/debug/app-debug.apk
